services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: callagent
      TZ: UTC
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  server:
    build: ./server
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_USER: root
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  agent:
    build: ./agent
    env_file: .env
    environment:
      BACKEND_URL: http://server:4000
    depends_on:
      - server
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - server
      - agent
    restart: unless-stopped

volumes:
  mysql_data:
