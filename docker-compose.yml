services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: callagent
      TZ: UTC
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  server:
    build: ./server
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_USER: root
      TUNNEL_METRICS_URL: http://tunnel:2000
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  agent:
    build: ./agent
    env_file: .env
    environment:
      BACKEND_URL: http://server:4000
      TUNNEL_METRICS_URL: http://tunnel:2000
    depends_on:
      - server
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - server
      - agent
    restart: unless-stopped

  # Kompyuterni internetga chiqaradi (Twilio shu orqali ulanadi).
  # Manzil har ishga tushganda o'zgaradi; server va agent uni avtomatik o'qiydi.
  # O'z domeningiz bo'lsa: .env da PUBLIC_URL=https://domen.uz va bu servisni o'chiring.
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://web:80
    depends_on:
      - web
    restart: unless-stopped

volumes:
  mysql_data:
